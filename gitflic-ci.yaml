stages:
  - build
  - release

build-deb:
  stage: build
  tags:
    - pgcc-deb
  script:
    - bash tools/prx-ci-build.sh
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

publish-release:
  stage: release
  tags:
    - pgcc-deb
  needs:
    - build-deb
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - python3 tools/prx-publish-gitflic-release.py --artifact "dist/claster-creator-${CI_COMMIT_TAG#v}.deb" --artifact dist/SHA256SUMS --notes CHANGELOG.md
