stages:
  - build
  - release

build-deb:
  stage: build
  tags:
    - pgcc-deb
  script:
    - python3 -B tools/prx-test-gitflic-publisher.py tools/prx-publish-gitflic-release.py
    - bash tools/prx-ci-build.sh
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

publish-release:
  # Supply GITFLIC_RELEASE_TOKEN as a secret project CI variable, never in YAML.
  # The publisher does not use or overwrite the runner-provided CI_JOB_TOKEN.
  stage: release
  tags:
    - pgcc-deb
  needs:
    - build-deb
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - python3 tools/prx-publish-gitflic-release.py --artifact "dist/claster-creator-${CI_COMMIT_TAG#v}.deb" --artifact "dist/claster-creator-${CI_COMMIT_TAG#v}.sha256" --notes CHANGELOG.md
